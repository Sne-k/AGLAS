name: Verification suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests'); assert(run_all_tests() == 0, 'Verification checks failed.')
